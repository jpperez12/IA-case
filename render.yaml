# Blueprint de Render: despliega el Dockerfile como servicio web.
# Las claves se cargan en el panel de Render (sync: false), nunca en este archivo.
# Para usar Claude en lugar de Gemini, agrega ANTHROPIC_API_KEY en el panel y fija LLM_PROVIDER=anthropic.
services:
  - type: web
    name: agente-ordenes-compra
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ACCESS_KEY
        sync: false
