# Blueprint de Render: despliega el Dockerfile como servicio web.
# Las claves se cargan en el panel de Render (sync: false), nunca en este archivo.
services:
  - type: web
    name: agente-ordenes-compra
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ACCESS_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-sonnet-4-6
